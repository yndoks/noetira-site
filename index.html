<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noetira</title>
<meta name="description" content="Noetira. AI first. Human in charge.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2317212B'/><path d='M9 23V9l14 14V9' fill='none' stroke='%23F5F6F4' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --paper:#F5F6F4; --ink:#17212B; --slate:#5E6A73; --accent:#2E6A5D;
  --serif:"Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#141A20;--ink:#E6EAE8;--slate:#9AA6AE;--accent:#7FB7A7}
}
:root[data-theme="dark"]{--paper:#141A20;--ink:#E6EAE8;--slate:#9AA6AE;--accent:#7FB7A7}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(1.5rem,6vw,4rem)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:40rem}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,9vw,6rem);letter-spacing:-.025em;line-height:1;margin:0}
p.label{font-size:1rem;color:var(--slate);margin:.9rem 0 0;letter-spacing:.01em}
blockquote{margin:3rem 0 2.75rem;padding:0 0 0 1.25rem;border-left:2px solid var(--accent);max-width:34ch}
blockquote p{font-family:var(--serif);font-size:clamp(1.2rem,2.3vw,1.45rem);line-height:1.45;margin:0}
blockquote p.close{margin-top:1rem;color:var(--slate)}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px}
a:hover{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.contact{font-size:1.05rem}
footer{font-size:.8rem;line-height:1.6;color:var(--slate)}
footer p{margin:0}
</style>
</head>
<body>
  <main>
    <h1>Noetira</h1>
    <p class="label">AI first. Human in charge.</p>
    <blockquote>
      <p>We keep trying to govern AI with organisational structures, budget categories and commercial contracts built for the technologies and the work it is replacing.</p>
      <p class="close">Noetira is the disagreement.</p>
    </blockquote>
    <p class="contact"><a href="mailto:counsel@noetira.ai">counsel@noetira.ai</a></p>
  </main>
  <footer>
    <p>noetira.ai</p>
    <p>No cookies. No tracking.</p>
  </footer>
</body>
</html>
